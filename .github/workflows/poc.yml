name: swift-network-evolution VLE Phase B
on:
  workflow_dispatch:
  push:
    branches: [master]
jobs:
  phase-b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Swift 6.3.3
        run: |
          wget -q https://download.swift.org/swift-6.3.3-release/ubuntu2404/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE-ubuntu24.04.tar.gz
          tar xzf swift-6.3.3-RELEASE-ubuntu24.04.tar.gz
          echo "$PWD/swift-6.3.3-RELEASE-ubuntu24.04/usr/bin" >> $GITHUB_PATH
      - name: Provenance
        run: uname -m && uname -r && swift --version
      - name: Clone vulnerable commit
        run: |
          git clone https://github.com/apple/swift-network-evolution.git vuln-repo
          cd vuln-repo
          git checkout a12af65d12c24ca5efe6b24d9fe3b5b7c95478bd
          echo "Commit: $(git log --oneline -1)"
          grep -n "T(variable\|T(exactly" Sources/SwiftNetwork/Utilities/Deserializer.swift | head -5
      - name: CONTROL patched commit
        run: |
          cd vuln-repo
          git checkout 558eb3e44f07124bd4fbaa9475f22a104718c3cf
          echo "PATCHED: $(git log --oneline -1)"
          set +e
          swift test --filter "testDeserializeVLEWithSizeOverflowsTargetType" 2>&1
          EXIT=$?; set -e
          echo "control_exit=$EXIT" >> $GITHUB_ENV
          echo "CONTROL exit=$EXIT"
      - name: EXPLOIT vulnerable commit
        run: |
          cd vuln-repo
          git checkout a12af65d12c24ca5efe6b24d9fe3b5b7c95478bd
          echo "VULNERABLE: $(git log --oneline -1)"
          set +e
          swift test --filter "testDeserializeVLEWithSizeOverflowsTargetType" 2>&1
          EXIT=$?; set -e
          echo "exploit_exit=$EXIT" >> $GITHUB_ENV
          echo "EXPLOIT exit=$EXIT"
          [ $EXIT -eq 134 ] && echo "*** SIGABRT ***" && echo "RESULT=SIGABRT" >> $GITHUB_ENV || true
          [ $EXIT -eq 139 ] && echo "*** SIGSEGV ***" && echo "RESULT=SIGSEGV" >> $GITHUB_ENV || true
          [ $EXIT -eq 0 ]   && echo "RESULT=PASSED" >> $GITHUB_ENV || true
          [ -z "$RESULT" ]  && echo "RESULT=EXIT_$EXIT" >> $GITHUB_ENV || true
      - name: Summary
        if: always()
        run: |
          echo "Control=$control_exit Exploit=$exploit_exit Result=$RESULT"
          [[ "$RESULT" == SIGABRT || "$RESULT" == SIGSEGV ]] && echo "Phase B: PASS" || echo "Phase B: $RESULT"
